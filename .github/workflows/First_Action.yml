name: Unity Build Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test Unity Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Unity (example: 2022.3 LTS; change to your version)
      - name: Setup Unity
        uses: game-ci/unity-builder@v3
        with:
          unityVersion: 6000.0.66f2
          targetPlatform: StandaloneLinux64
          buildPath: build

      # Verify the build folder exists (indicates build success)
      - name: Verify build
        run: |
          if [ ! -d "build" ]; then
            echo "Build failed: folder 'build' not created"
            exit 1
          fi
          echo "Build succeeded!"
